name: Build macOS and Linux

on:
  workflow_dispatch:
    inputs:
      sign_macos:
        description: Sign and notarize macOS packages (requires Apple secrets)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: macos
            arch: x64
            macho_arch: x86_64
            files: |
              dist/*.dmg
              dist/*.zip
          - os: macos-15
            platform: macos
            arch: arm64
            macho_arch: arm64
            files: |
              dist/*.dmg
              dist/*.zip
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            files: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Verify runner architecture
        shell: bash
        run: test "$(node -p process.arch)" = "${{ matrix.arch }}"
      - run: bun ci
      - run: bun run test
      - name: Install Linux build dependency
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libopenjp2-tools
      - name: Build unsigned package
        if: matrix.platform != 'macos' || !inputs.sign_macos
        run: bun run dist --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Build signed and notarized macOS package
        if: matrix.platform == 'macos' && inputs.sign_macos
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "Missing GitHub Actions secret: $name" >&2; exit 1; }
          done
          bun run dist --${{ matrix.arch }} \
            --config.forceCodeSigning=true \
            --config.mac.notarize=true \
            --config.mac.hardenedRuntime=true \
            --config.mac.entitlements=build/entitlements.mac.plist \
            --config.mac.entitlementsInherit=build/entitlements.mac.plist
      - name: Verify packages
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            compgen -G 'dist/*.dmg'
            compgen -G 'dist/*.zip'
          else
            compgen -G 'dist/*.AppImage'
          fi
      - name: Verify macOS package architecture
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ matrix.macho_arch }}"
          check_arch() {
            actual="$(lipo -archs "$1")"
            echo "$1: $actual (expected $expected)"
            test "$actual" = "$expected"
          }
          shopt -s nullglob
          app_binaries=(dist/mac*/Lumilan\ Chat.app/Contents/MacOS/Lumilan\ Chat)
          zip_files=(dist/*.zip)
          dmg_files=(dist/*.dmg)
          test "${#app_binaries[@]}" -eq 1
          test "${#zip_files[@]}" -eq 1
          test "${#dmg_files[@]}" -eq 1
          check_arch "${app_binaries[0]}"
          zip_dir="$(mktemp -d)"
          ditto -x -k "${zip_files[0]}" "$zip_dir"
          check_arch "$zip_dir/Lumilan Chat.app/Contents/MacOS/Lumilan Chat"
          dmg_mount="$(mktemp -d)"
          hdiutil attach "${dmg_files[0]}" -readonly -nobrowse -mountpoint "$dmg_mount" -quiet
          trap 'hdiutil detach "$dmg_mount" -quiet' EXIT
          check_arch "$dmg_mount/Lumilan Chat.app/Contents/MacOS/Lumilan Chat"
      - name: Verify macOS signature and notarization
        if: matrix.platform == 'macos' && inputs.sign_macos
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(dist/mac*/Lumilan\ Chat.app)
          test "${#apps[@]}" -eq 1
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          spctl --assess --type exec --verbose=2 "${apps[0]}"
          xcrun stapler validate "${apps[0]}"
      - uses: actions/upload-artifact@v7
        with:
          name: lumilan-chat-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.files }}
          if-no-files-found: error
