name: Build macOS and Linux

on:
  workflow_dispatch:
    inputs:
      sign_macos:
        description: Sign and notarize macOS packages (requires Apple secrets)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows
            arch: x64
          - os: macos-15-intel
            platform: macos
            arch: x64
            macho_arch: x86_64
            files: |
              dist/*.dmg
              dist/*.zip
          - os: macos-15
            platform: macos
            arch: arm64
            macho_arch: arm64
            files: |
              dist/*.dmg
              dist/*.zip
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            files: |
              dist/*.AppImage
              dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Verify private source access
        shell: bash
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
        run: test -n "$PRIVATE_SOURCE_TOKEN" || { echo "Missing Actions secret PRIVATE_SOURCE_TOKEN" >&2; exit 1; }
      - uses: actions/checkout@v7
        with:
          repository: iyansanjaya/lumilan
          ref: master
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Verify complete source
        shell: bash
        run: |
          test -s public/index.html
          test -s public/app.css
          test -s public/app.ts
          test -s public/i18n.ts
          echo "Private source commit: $(git rev-parse --short HEAD)"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Verify runner architecture
        shell: bash
        run: test "$(node -p process.arch)" = "${{ matrix.arch }}"
      - run: bun ci
      - name: Verify strict types and tests three times
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do bun run test; done
      - name: Prepare native runner disk for full 5 GB verification
        if: matrix.platform == 'linux' || matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          free_bytes() { node -e 'const d=require("node:fs").statfsSync(process.cwd(),{bigint:true});console.log(String(d.bavail*d.bsize))'; }
          resolved_path() { node -e 'console.log(require("node:fs").realpathSync(process.argv[1]))' "$1"; }
          required=17179869184
          before="$(free_bytes)"
          echo "Workspace free before preparation: $before bytes; required: $required bytes"
          if ((before < required)); then
            [[ "${GITHUB_ACTIONS:-}" = true && "${RUNNER_ENVIRONMENT:-}" = github-hosted ]] || { echo 'Disk reclamation is restricted to GitHub-hosted CI.' >&2; exit 1; }
            if [[ "${RUNNER_OS:-}" = Linux ]]; then
              sdk=/usr/local/lib/android/sdk
              if [[ -d "$sdk" ]]; then
                [[ ! -L "$sdk" && "$(resolved_path "$sdk")" = "$sdk" ]] || { echo 'Unexpected Android SDK path; refusing cleanup.' >&2; exit 1; }
                echo "Reclaiming unused runner Android SDK: $sdk"
                sudo rm -rf -- "$sdk"
              fi
            elif [[ "${RUNNER_OS:-}" = macOS ]]; then
              selected="$(resolved_path "$(xcode-select -p)")"
              selected_app="${selected%/Contents/Developer}"
              [[ "$selected" = "$selected_app/Contents/Developer" && "$(dirname "$selected_app")" = /Applications && -d "$selected_app" ]] || { echo 'Unexpected selected Xcode path; refusing cleanup.' >&2; exit 1; }
              echo "Preserving selected Xcode and its aliases: $selected_app"
              for bundle in /Applications/Xcode_*.app; do
                [[ -d "$bundle" && ! -L "$bundle" ]] || continue
                resolved="$(resolved_path "$bundle")"
                [[ "$resolved" = "$bundle" && "$(dirname "$resolved")" = /Applications ]] || { echo 'Unexpected Xcode bundle path; refusing cleanup.' >&2; exit 1; }
                [[ "$resolved" != "$selected_app" ]] || continue
                (( $(free_bytes) < required )) || break
                echo "Reclaiming unused runner Xcode: $resolved"
                sudo rm -rf -- "$resolved"
              done
            else
              echo 'Unexpected runner OS; refusing cleanup.' >&2; exit 1
            fi
          fi
          after="$(free_bytes)"
          echo "Workspace free after preparation: $after bytes; required: $required bytes"
          ((after >= required)) || { echo 'Full 5 GB verification still requires at least 16 GiB free.' >&2; exit 1; }
      - name: Verify full 5 GB transfer three times
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do bun run test:large; done
      - name: Install Linux build and native smoke dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libopenjp2-tools libnotify4 dbus-x11 libglib2.0-bin python3-dbus python3-gi xvfb x11-utils openbox trayer weston libgbm1 libnss3 libgtk-3-0 libasound2t64 fontconfig fonts-noto-cjk
          # Ubuntu's AppArmor policy otherwise blocks Chromium's user-namespace sandbox.
          # Keep Electron sandboxing enabled on this disposable runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build unsigned package
        if: matrix.platform != 'windows' && (matrix.platform != 'macos' || !inputs.sign_macos)
        run: bun run dist --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Pack Windows app for native validation
        if: matrix.platform == 'windows'
        run: bun run pack --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Build signed and notarized macOS package
        if: matrix.platform == 'macos' && inputs.sign_macos
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "Missing GitHub Actions secret: $name" >&2; exit 1; }
          done
          bun run dist --${{ matrix.arch }} \
            --config.forceCodeSigning=true \
            --config.mac.notarize=true \
            --config.mac.hardenedRuntime=true \
            --config.mac.entitlements=build/entitlements.mac.plist \
            --config.mac.entitlementsInherit=build/entitlements.mac.plist
      - name: Verify packaged interface
        run: bun run verify:package
      - name: Verify packages
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            compgen -G 'dist/*.dmg'
            compgen -G 'dist/*.zip'
          else
            compgen -G 'dist/*.AppImage'
            test -s dist/latest-linux.yml
          fi
      - name: Verify macOS package architecture
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ matrix.macho_arch }}"
          check_arch() {
            actual="$(lipo -archs "$1")"
            echo "$1: $actual (expected $expected)"
            test "$actual" = "$expected"
          }
          shopt -s nullglob
          app_binaries=(dist/mac*/Lumilan\ Chat.app/Contents/MacOS/Lumilan\ Chat)
          zip_files=(dist/*.zip)
          dmg_files=(dist/*.dmg)
          test "${#app_binaries[@]}" -eq 1
          test "${#zip_files[@]}" -eq 1
          test "${#dmg_files[@]}" -eq 1
          check_arch "${app_binaries[0]}"
          zip_dir="$(mktemp -d)"
          ditto -x -k "${zip_files[0]}" "$zip_dir"
          check_arch "$zip_dir/Lumilan Chat.app/Contents/MacOS/Lumilan Chat"
          dmg_mount="$(mktemp -d)"
          hdiutil attach "${dmg_files[0]}" -readonly -nobrowse -mountpoint "$dmg_mount" -quiet
          trap 'hdiutil detach "$dmg_mount" -quiet' EXIT
          check_arch "$dmg_mount/Lumilan Chat.app/Contents/MacOS/Lumilan Chat"
      - name: Verify macOS signature and notarization
        if: matrix.platform == 'macos' && inputs.sign_macos
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(dist/mac*/Lumilan\ Chat.app)
          test "${#apps[@]}" -eq 1
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          spctl --assess --type exec --verbose=2 "${apps[0]}"
          xcrun stapler validate "${apps[0]}"
          codesign -d --entitlements :- "${apps[0]}" 2>/dev/null > "$RUNNER_TEMP/lumilan-entitlements.plist"
          python3 -c 'import plistlib,sys; assert plistlib.load(open(sys.argv[1],"rb")).get("com.apple.security.device.audio-input") is True' "$RUNNER_TEMP/lumilan-entitlements.plist"
      - name: Smoke packaged Windows UI and Lumi
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do bun run smoke:ui; bun run smoke:notch; done
      - name: Smoke packaged macOS UI and Lumi
        if: matrix.platform == 'macos'
        shell: bash
        env:
          # Hosted Intel runners can lack a usable EGL/GPU display. Exercise the
          # real compositor in software without changing the distributed app.
          LUMILAN_SMOKE_SOFTWARE_RENDERING: "1"
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do bun run smoke:ui; bun run smoke:notch; done
      - name: Verify Linux Japanese fallback font
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          family="$(fc-match -f '%{family}\n' 'sans-serif:lang=ja')"
          printf 'Japanese sans-serif fallback: %s\n' "$family"
          [[ "$family" == *CJK* ]] || { echo 'Japanese smoke requires a CJK fallback font.' >&2; exit 1; }
      - name: Smoke packaged Linux X11 and native Wayland fallback
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          bash scripts/smoke-linux.sh x11
          bash scripts/smoke-linux.sh wayland
      - name: Upload native smoke screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lumilan-smoke-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/ui-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: matrix.platform != 'windows'
        with:
          name: lumilan-chat-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.files }}
          if-no-files-found: error
